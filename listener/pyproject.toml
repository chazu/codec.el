[project]
name = "codec-listener"
version = "0.1.0"
description = "Local speech-to-text listener for codec.el"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper==1.2.1",
    "numpy==2.5.5",
    "onnxruntime==1.32.0",
    "sounddevice==0.5.6",
]

[dependency-groups]
dev = ["pytest==9.0.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
